    <main class="main-content">
        <div class="about-centered-container" style="max-width: 600px;">
            
            <header class="about-header-main animate-fade-up delay-1" style="margin-bottom: 40px;">
                <h2 data-i18n="contact_page_title">Contact</h2>
                <p data-i18n="contact_page_subtitle">Let's talk about working together</p>
            </header>

            <div class="contact-buttons-row animate-fade-up delay-2">
                <button class="contact-btn" id="copyPhoneBtn">
                    <span id="copyPhoneText" data-i18n="contact_btn_phone">Copy phone</span>
                    <svg id="copyPhoneIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </button>
                
                <button class="contact-btn" id="copyEmailBtn">
                    <span id="copyEmailText" data-i18n="contact_btn_copy">Copy email</span>
                    <svg id="copyEmailIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </button>
            </div>

            <div class="contact-divider animate-fade-up delay-3">
                <span data-i18n="contact_or">or</span>
            </div>

            <form id="contactForm" class="contact-form animate-fade-up delay-4">
                <div class="form-row">
                    <!-- Agregamos name="name" -->
                    <input type="text" id="nameInput" name="name" placeholder="Your name" data-i18n-placeholder="contact_ph_name">
                    <!-- Agregamos name="email" -->
                    <input type="email" id="emailInput" name="email" placeholder="Your email" data-i18n-placeholder="contact_ph_email">
                </div>
                <!-- Agregamos name="message" -->
                <textarea id="messageInput" name="message" placeholder="Your message" data-i18n-placeholder="contact_ph_message" rows="6"></textarea>
                
                <button type="submit" class="contact-submit-btn" data-i18n="contact_btn_send">Send</button>
                
                <div class="contact-footer-note">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <span data-i18n="contact_response_time">Around 3-5 hours to respond</span>
                </div>
            </form>

        </div>
